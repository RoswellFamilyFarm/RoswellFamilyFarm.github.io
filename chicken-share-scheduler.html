<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roswell Chicken Share Scheduler</title>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
<style>
body{font-family:"Segoe UI",Arial,sans-serif;margin:0;padding:12px;color:#374151;background:#fff}
.box{border:1px solid #d1d5db;border-radius:12px;padding:16px;background:#f9fafb}
h3{margin:0 0 8px;color:#15803d;font-size:20px}
p{line-height:1.4}
label{display:block;font-weight:700;margin:12px 0 6px}
select{width:100%;min-height:44px;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font-size:16px}
.status{margin-top:10px;padding:10px 12px;border-radius:8px;background:#fff7ed;color:#9a3412;font-size:14px}
.status.ok{background:#f0fdf4;color:#166534}.status.error{background:#fef2f2;color:#b91c1c}.small{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="box">
<h3>🐔 Choose Your Processing Week</h3>
<p>Processing weeks are automatically limited to approximately <strong>6–8 weeks after reservation</strong>. Each week is limited to <strong>50 chickens</strong>.</p>
<label for="week">Available processing week</label>
<select id="week" disabled><option>Loading available weeks…</option></select>
<div id="status" class="status">Checking current availability…</div>
<p class="small">Minimum Chicken Share reservation: 5 chickens. Full weeks are removed automatically.</p>
</div>
<script>
(function(){
let formId="",selected=null,currentQty=0,hold=null,loaded=false;
let cfg={apiUrl:"",quantityFieldName:"",quantityFieldId:"",minQty:5};
const week=document.getElementById("week"), status=document.getElementById("status");
function setStatus(m,c){status.textContent=m;status.className="status"+(c?" "+c:"")}
function setting(n,d=""){try{const v=JFCustomWidget.getWidgetSetting(n);return(v===undefined||v===null||v==="")?d:v}catch(e){return d}}
function parseQty(data){
  const vals=[];
  if(Array.isArray(data)) vals.push(...data);
  else if(data&&typeof data==="object") Object.values(data).forEach(v=>Array.isArray(v)?vals.push(...v):vals.push(v));
  else vals.push(data);
  for(const v of vals){const n=parseInt(String(v).replace(/[^\d.-]/g,""),10);if(Number.isFinite(n)&&n>0)return n}
  return 0;
}
function getQty(){return new Promise(resolve=>{
  try{
    if(cfg.quantityFieldName&&typeof JFCustomWidget.getFieldsValueByName==="function"){
      JFCustomWidget.getFieldsValueByName([cfg.quantityFieldName],d=>resolve(parseQty(d)));return;
    }
    if(cfg.quantityFieldId&&typeof JFCustomWidget.getFieldsValueById==="function"){
      JFCustomWidget.getFieldsValueById([parseInt(cfg.quantityFieldId,10)],d=>resolve(parseQty(d)));return;
    }
  }catch(e){}
  resolve(0);
})}
async function apiGet(params){
  const u=new URL(cfg.apiUrl);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
  const r=await fetch(u,{cache:"no-store"}), d=await r.json(); if(!d.ok) throw new Error(d.error||"Scheduler service error"); return d;
}
async function apiPost(payload){
  const r=await fetch(cfg.apiUrl,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
  const d=await r.json(); if(!d.ok) throw new Error(d.error||"Scheduler service error"); return d;
}
function sendData(valid){
  if(!valid||!selected){JFCustomWidget.sendData({valid:false,value:""});return}
  JFCustomWidget.sendData({valid:true,value:JSON.stringify({
    week_start:selected.start,week_end:selected.end,week_label:selected.label,chickens:currentQty,hold_token:hold?hold.token:""
  })});
}
async function refresh(){
  currentQty=await getQty();
  if(currentQty<cfg.minQty){
    week.innerHTML='<option>Select at least 5 chickens first</option>';week.disabled=true;
    setStatus("Choose your total number of chickens first. Minimum reservation is 5.","error");sendData(false);return;
  }
  const d=await apiGet({action:"availability",qty:currentQty,formId});
  week.innerHTML='<option value="">Choose a processing week</option>';
  d.weeks.forEach(w=>{const o=document.createElement("option");o.value=w.start;o.textContent=`${w.label} — ${w.available} chickens available`;o.dataset.week=JSON.stringify(w);week.appendChild(o)});
  week.disabled=d.weeks.length===0;
  setStatus(d.weeks.length?`Showing 6–8 week options for ${currentQty} chickens.`:"No week in your 6–8 week window currently has enough capacity.",d.weeks.length?"ok":"error");
  sendData(false);
}
week.addEventListener("change",()=>{const o=week.options[week.selectedIndex];selected=o&&o.dataset.week?JSON.parse(o.dataset.week):null;hold=null;sendData(!!selected)});
JFCustomWidget.subscribe("ready",async data=>{
  formId=String((data&&data.formId)||"");
  cfg.apiUrl=setting("ApiUrl","");
  cfg.quantityFieldName=setting("QuantityFieldName","");
  cfg.quantityFieldId=setting("QuantityFieldId","");
  cfg.minQty=parseInt(setting("MinQuantity","5"),10)||5;
  try{await refresh();loaded=true}catch(e){setStatus(e.message,"error")}
  setInterval(async()=>{try{const q=await getQty();if(q!==currentQty){selected=null;hold=null;await refresh()}}catch(e){}},1200);
  try{JFCustomWidget.requestFrameResize({height:260})}catch(e){}
});
JFCustomWidget.subscribe("submit",async()=>{
  try{
    if(!loaded)throw new Error("Scheduler is still loading.");
    currentQty=await getQty();
    if(currentQty<cfg.minQty)throw new Error("Please reserve at least 5 chickens.");
    if(!selected)throw new Error("Please choose a processing week.");
    const d=await apiPost({action:"hold",formId,weekStart:selected.start,qty:currentQty});
    hold={token:d.token};
    JFCustomWidget.sendSubmit({valid:true,value:JSON.stringify({
      week_start:selected.start,week_end:selected.end,week_label:selected.label,chickens:currentQty,hold_token:d.token
    })});
  }catch(e){setStatus(e.message||"Please check your selection.","error");JFCustomWidget.sendSubmit({valid:false,value:""})}
});
})();
</script>
</body>
</html>
